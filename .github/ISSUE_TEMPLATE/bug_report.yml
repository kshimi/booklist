name: バグ報告
description: バグや不具合の報告
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: バグの内容
      description: 発生しているバグの内容を記述してください
      placeholder: どのような問題が発生していますか？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: バグを再現する手順を記述してください
      placeholder: |
        1. '...' に移動
        2. '...' をクリック
        3. '...' を入力
        4. エラーが発生
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どのように動作すべきかを記述してください
  - type: dropdown
    id: environment
    attributes:
      label: 発生環境
      description: バグが発生した環境を選択してください
      options:
        - 開発環境（ローカル）
        - ステージング環境
        - 本番環境
  - type: textarea
    id: notes
    attributes:
      label: 備考
      description: その他の情報（スクリーンショット、ログなど）
  - type: checkboxes
    id: workflow_state
    attributes:
      label: 開発状態
      description: |
        Phase 1/3/4 は Claude Code が更新します。
        開発者が手動でチェックするのは Phase 2 と、5 行目（該当する場合）です。
        Phase 2 はレビュー後にチェックしてください。
        Phase 4 に至らない「判断のみ」の Issue の場合は 5 行目もチェックしてください。
      options:
        - label: "Phase 1: 設計書作成完了"
        - label: "Phase 2: 開発者承認"
        - label: "Phase 3: 仕様書更新完了"
        - label: "Phase 4: 実装完了"
        - label: "（判断のみ Issue）Phase 4 は該当なし"
