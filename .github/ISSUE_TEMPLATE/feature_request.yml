name: 機能要望
description: 新しい機能や改善の提案
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 要望する機能の概要を記述してください
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 背景・動機
      description: この機能が必要な理由や背景を記述してください
  - type: textarea
    id: image
    attributes:
      label: 実現イメージ
      description: どのように実現されるべきかのイメージを記述してください
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - 高
        - 中
        - 低
  - type: textarea
    id: notes
    attributes:
      label: 備考
      description: その他の情報や参考資料
  - type: checkboxes
    id: workflow_state
    attributes:
      label: 開発状態
      description: |
        Phase 1/3/4 は Claude Code が更新します。
        開発者が手動でチェックするのは Phase 2 と、5 行目（該当する場合）です。
        Phase 2 はレビュー後にチェックしてください。
        Phase 4 に至らない「判断のみ」の Issue の場合は 5 行目もチェックしてください。
      options:
        - label: "Phase 1: 設計書作成完了"
        - label: "Phase 2: 開発者承認"
        - label: "Phase 3: 仕様書更新完了"
        - label: "Phase 4: 実装完了"
        - label: "（判断のみ Issue）Phase 4 は該当なし"
